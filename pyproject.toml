[project]
name = "inspire-dojson"
version = "63.2.36"
description = "INSPIRE-specific rules to transform from MARCXML to JSON and back."
authors = [
    { name = "CERN", email = "admin@inspirehep.net" },
]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "IDUtils>=1.0.1,<2.0",
    "dojson>=1.3.1,<2.0",
    "inspire-schemas",
    "inspire-utils>=3.0.65,<4.0",
    "langdetect>=1.0.7,<2.0",
    "pycountry>=18.12.8,<27",
    "MarkupSafe>=1.1.1",
    "setuptools<81",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/inspirehep/inspire-dojson"
Repository = "https://github.com/inspirehep/inspire-dojson"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=8.3.5,<9.0.0"
pytest-cov = ">=5.0.0,<7.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = "3.5.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
